<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="bgmiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="50%" stop-color="#0f1115" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Industrial Yellow / Krafton Gold Gradient -->
    <linearGradient id="bgmiYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea75" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Helmet Steel Shading -->
    <linearGradient id="steelDome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#334155" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Visor Slit Gradient -->
    <linearGradient id="visorPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Visor Amber Slit Glow -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="helmetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Industrial Rounded Hexagonal Emblem Base -->
  <polygon points="64,6 118,24 118,84 64,122 10,84 10,24" fill="url(#bgmiYellow)" />
  <polygon points="64,9 114,26 114,82 64,119 14,82 14,26" fill="#08080a" />
  <polygon points="64,12 111,28 111,80 64,116 17,80 17,28" fill="url(#bgmiBg)" />

  <!-- Background Tactical Hazard Stripes (Subtle Krafton Yellow) -->
  <g opacity="0.12">
    <path d="M20 20 L40 20 L20 40 Z" fill="#f59e0b" />
    <path d="M50 20 L70 20 L20 70 L20 50 Z" fill="#f59e0b" />
    <path d="M80 20 L100 20 L20 100 L20 80 Z" fill="#f59e0b" />
    <path d="M108 32 L108 52 L56 104 L36 104 Z" fill="#f59e0b" />
  </g>

  <!-- LEVEL-3 SPETSNAZ HELMET ICON -->
  <g filter="url(#helmetShadow)" transform="translate(0, -2)">
    <!-- Helmet Outer Dome -->
    <path d="M64 22 C42 22 26 36 26 58 C26 78 36 92 64 96 C92 92 102 78 102 58 C102 36 86 22 64 22 Z" 
          fill="url(#steelDome)" 
          stroke="#000000" 
          stroke-width="3" />

    <!-- Helmet Top Center Ridge Weld Line -->
    <path d="M64 22 C64 35 64 50 64 56" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M63 22 C63 35 63 50 63 56" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />

    <!-- Heavy Brow Line Plate with Rivets -->
    <path d="M28 54 C40 50 88 50 100 54 L98 60 C86 56 42 56 30 60 Z" fill="#0f172a" />
    <circle cx="34" cy="56" r="1.5" fill="#f59e0b" />
    <circle cx="94" cy="56" r="1.5" fill="#f59e0b" />

    <!-- Welded Steel Face Shield / Visor Faceplate -->
    <path d="M30 58 L98 58 L94 84 L76 92 L52 92 L34 84 Z" 
          fill="url(#visorPlate)" 
          stroke="#334155" 
          stroke-width="2" />

    <!-- Visor Slit Frame (The Iconic Narrow Eye Viewport) -->
    <rect x="36" y="64" width="56" height="11" rx="2" fill="#000000" stroke="url(#bgmiYellow)" stroke-width="1.8" />
    
    <!-- Three Amber Glowing Protective Grill Bars -->
    <line x1="48" y1="64" x2="48" y2="75" stroke="url(#bgmiYellow)" stroke-width="2.2" />
    <line x1="64" y1="64" x2="64" y2="75" stroke="url(#bgmiYellow)" stroke-width="2.2" />
    <line x1="80" y1="64" x2="80" y2="75" stroke="url(#bgmiYellow)" stroke-width="2.2" />

    <!-- Inside Viewport Glowing Eyes Reflection (Tactical HUD) -->
    <rect x="52" y="67" width="8" height="5" rx="1" fill="#f59e0b" opacity="0.6" />
    <rect x="68" y="67" width="8" height="5" rx="1" fill="#f59e0b" opacity="0.6" />

    <!-- Lower Chin Ventilation Grill -->
    <g fill="#1e293b" stroke="#000000" stroke-width="0.5">
      <circle cx="56" cy="84" r="1.5" />
      <circle cx="64" cy="84" r="1.5" />
      <circle cx="72" cy="84" r="1.5" />
      <circle cx="60" cy="88" r="1.5" />
      <circle cx="68" cy="88" r="1.5" />
    </g>
  </g>

  <!-- High-Impact BGMI Tactical Pill at Bottom -->
  <g transform="translate(0, 4)">
    <path d="M32 94 L96 94 L90 114 L26 114 Z" fill="#000000" />
    <path d="M33 95 L95 95 L90 112 L28 112 Z" fill="url(#bgmiYellow)" />
    <path d="M35 97 L93 97 L88 110 L30 110 Z" fill="#0b0e14" />
    
    <text x="61" y="107" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="12" 
          font-weight="900" 
          letter-spacing="2" 
          text-anchor="middle" 
          fill="#ffea75" 
          stroke="#000000" 
          stroke-width="0.5">
      BGMI
    </text>
  </g>

  <!-- Corner Hazard Indicators -->
  <polygon points="10,24 22,18 18,28" fill="#f59e0b" />
  <polygon points="118,24 106,18 110,28" fill="#f59e0b" />
</svg>
