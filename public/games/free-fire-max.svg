<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="ffWordmarkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Bevel Orange Glow for Letters -->
    <linearGradient id="ffFireOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd000" />
      <stop offset="50%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#cc1100" />
    </linearGradient>

    <linearGradient id="maxRedPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Left Icon Emblem Container (scaled and shifted) -->
  <g transform="translate(10, 8) scale(0.82)">
    <!-- Hexagonal Shield Base -->
    <polygon points="64,6 116,24 116,84 64,122 12,84 12,24" fill="url(#goldBorder)" />
    <polygon points="64,10 112,26 112,82 64,118 16,82 16,26" fill="#100302" />
    
    <!-- Flames in Emblem -->
    <path d="M64 16 C68 28 78 40 86 48 C82 46 76 44 72 44 C80 54 84 66 78 78 C74 68 70 62 66 60 C66 70 60 84 48 92 C56 82 58 72 56 64 C52 70 46 74 40 76 C46 64 54 52 52 38 C56 46 60 50 62 50 C62 38 63 26 64 16 Z" 
          fill="url(#ffFireOrange)" />
    
    <!-- Center FF initials -->
    <path d="M42 36 L62 36 L59 44 L49 44 L47 50 L56 50 L53 57 L44 57 L36 82 L27 82 L38 46 L38 36 Z" 
          fill="#ffffff" stroke="#000" stroke-width="1.2" />
    <path d="M58 36 L78 36 L75 44 L65 44 L63 50 L72 50 L69 57 L60 57 L52 82 L43 82 L54 46 L54 36 Z" 
          fill="#f8fafc" stroke="#b91c1c" stroke-width="1.2" />
    
    <!-- Little MAX banner on emblem -->
    <polygon points="34,92 94,92 88,110 28,110" fill="url(#maxRedPill)" stroke="#fef08a" stroke-width="1.5" />
    <text x="59" y="105" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="1">MAX</text>
  </g>

  <!-- Typography: FREE FIRE -->
  <!-- Back shadow layer for massive readability -->
  <text x="122" y="66" 
        font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" 
        font-size="44" 
        font-weight="900" 
        font-style="italic" 
        letter-spacing="2" 
        fill="#000000" 
        stroke="#000000" 
        stroke-width="8" 
        stroke-linejoin="round">
    FREE FIRE
  </text>
  <!-- Main letters with metallic styling and fiery edge -->
  <text x="122" y="66" 
        font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" 
        font-size="44" 
        font-weight="900" 
        font-style="italic" 
        letter-spacing="2" 
        fill="url(#ffWordmarkMetal)" 
        stroke="url(#ffFireOrange)" 
        stroke-width="2" 
        stroke-linejoin="round"
        filter="url(#logoShadow)">
    FREE FIRE
  </text>

  <!-- Slogan / Publisher Tag -->
  <text x="126" y="82" 
        font-family="'Arial', sans-serif" 
        font-size="10" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#fdba74">
    GARENA ESPORTS ARENA
  </text>

  <!-- MAX Official Heavy Badge on Right -->
  <g transform="translate(322, 34)">
    <polygon points="4,2 88,2 78,38 -6,38" fill="#000000" filter="url(#logoShadow)" />
    <polygon points="5,3 87,3 77,36 -4,36" fill="url(#goldBorder)" />
    <polygon points="7,5 85,5 75,34 -2,34" fill="url(#maxRedPill)" />
    <text x="40" y="27" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="24" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="2" 
          text-anchor="middle" 
          fill="#ffffff" 
          stroke="#000000" 
          stroke-width="1.5">
      MAX
    </text>
    <text x="40" y="26" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="24" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="2" 
          text-anchor="middle" 
          fill="#fff5cc">
      MAX
    </text>
  </g>
</svg>
