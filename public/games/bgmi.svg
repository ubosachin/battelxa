<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <defs>
    <!-- Krafton Gold / Amber Gradient -->
    <linearGradient id="bgmiGoldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc" />
      <stop offset="25%" stop-color="#ffcc00" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- White Steel Text Gradient -->
    <linearGradient id="bgmiWhiteText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f1f5f9" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="bgmiBadgeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffea75" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="bgmiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Left Level 3 Helmet Emblem (Scaled down) -->
  <g transform="translate(10, 8) scale(0.82)">
    <!-- Base Hexagon -->
    <polygon points="64,6 118,24 118,84 64,122 10,84 10,24" fill="url(#bgmiBadgeGold)" />
    <polygon points="64,10 113,26 113,82 64,118 15,82 15,26" fill="#0d1117" />
    
    <!-- Helmet -->
    <path d="M64 24 C44 24 28 36 28 58 C28 76 38 90 64 94 C90 90 100 76 100 58 C100 36 84 24 64 24 Z" 
          fill="#1e293b" stroke="#000" stroke-width="2" />
    <path d="M30 58 L98 58 L94 84 L76 90 L52 90 L34 84 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Slit and Grill -->
    <rect x="38" y="63" width="52" height="11" rx="2" fill="#000000" stroke="url(#bgmiBadgeGold)" stroke-width="1.5" />
    <line x1="48" y1="63" x2="48" y2="74" stroke="url(#bgmiBadgeGold)" stroke-width="2" />
    <line x1="64" y1="63" x2="64" y2="74" stroke="url(#bgmiBadgeGold)" stroke-width="2" />
    <line x1="80" y1="63" x2="80" y2="74" stroke="url(#bgmiBadgeGold)" stroke-width="2" />

    <!-- Bottom BGMI tag on emblem -->
    <polygon points="34,92 94,92 88,110 28,110" fill="url(#bgmiBadgeGold)" />
    <text x="61" y="105" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">BGMI</text>
  </g>

  <!-- Typography: BATTLEGROUNDS -->
  <text x="122" y="58" 
        font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="2" 
        fill="#000000" 
        stroke="#000000" 
        stroke-width="6" 
        stroke-linejoin="round">
    BATTLEGROUNDS
  </text>
  <text x="122" y="58" 
        font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="2" 
        fill="url(#bgmiWhiteText)" 
        stroke="#1e293b" 
        stroke-width="1" 
        filter="url(#bgmiShadow)">
    BATTLEGROUNDS
  </text>

  <!-- Typography: MOBILE INDIA -->
  <text x="122" y="86" 
        font-family="'Impact', 'Arial Black', sans-serif" 
        font-size="24" 
        font-weight="900" 
        letter-spacing="3" 
        fill="#000000" 
        stroke="#000000" 
        stroke-width="5">
    MOBILE INDIA
  </text>
  <text x="122" y="86" 
        font-family="'Impact', 'Arial Black', sans-serif" 
        font-size="24" 
        font-weight="900" 
        letter-spacing="3" 
        fill="url(#bgmiGoldText)" 
        filter="url(#bgmiShadow)">
    MOBILE INDIA
  </text>

  <!-- Slogan / Publisher Tag -->
  <text x="124" y="102" 
        font-family="'Arial', sans-serif" 
        font-size="9" 
        font-weight="800" 
        letter-spacing="3" 
        fill="#94a3b8">
    KRAFTON OFFICIAL ESPORTS
  </text>

  <!-- BGMI Badge on Right -->
  <g transform="translate(370, 36)">
    <polygon points="4,2 80,2 72,36 -4,36" fill="#000000" filter="url(#bgmiShadow)" />
    <polygon points="5,3 79,3 71,34 -2,34" fill="url(#bgmiBadgeGold)" />
    <text x="38" y="25" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="20" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="2" 
          text-anchor="middle" 
          fill="#000000">
      BGMI
    </text>
  </g>
</svg>
