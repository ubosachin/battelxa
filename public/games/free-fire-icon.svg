<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradients -->
    <linearGradient id="ffBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0502" />
      <stop offset="50%" stop-color="#2a0a04" />
      <stop offset="100%" stop-color="#0a0202" />
    </linearGradient>

    <!-- Outer Rim Metallic Gradient -->
    <linearGradient id="ffGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd24d" />
      <stop offset="35%" stop-color="#ff7a00" />
      <stop offset="70%" stop-color="#b82e00" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>

    <!-- Flame Wing Left Gradient -->
    <linearGradient id="flameLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#990000" />
      <stop offset="30%" stop-color="#e62e00" />
      <stop offset="65%" stop-color="#ff8c00" />
      <stop offset="100%" stop-color="#ffe600" />
    </linearGradient>

    <!-- Flame Wing Right Gradient -->
    <linearGradient id="flameRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#800000" />
      <stop offset="30%" stop-color="#cc2400" />
      <stop offset="70%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="#ffd500" />
    </linearGradient>

    <!-- Central Dagger / Blade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f0f0f5" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- MAX Badge Gradient -->
    <linearGradient id="maxBadgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Filters for Glow and Shadow -->
    <filter id="ffGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Base -->
  <polygon points="64,6 116,24 116,84 64,122 12,84 12,24" fill="url(#ffGoldRim)" />
  <polygon points="64,9 113,26 113,82 64,119 15,82 15,26" fill="#080302" />
  <polygon points="64,12 110,28 110,80 64,116 18,80 18,28" fill="url(#ffBgGrad)" />

  <!-- Background Fire Aura / Subtle Rays -->
  <path d="M64 20 L76 56 L104 36 L86 68 L108 82 L76 80 L64 110 L52 80 L20 82 L42 68 L24 36 L52 56 Z" 
        fill="#ff4d00" opacity="0.25" filter="url(#ffGlow)" />

  <!-- Left Blazing Wing -->
  <path d="M64 88 C54 75 36 68 22 52 C20 66 28 80 44 86 C32 82 25 76 20 68 C18 78 28 90 48 94 C38 92 32 88 28 82 C34 94 48 102 64 106 Z" 
        fill="url(#flameLeft)" filter="url(#dropShadow)" />

  <!-- Right Blazing Wing -->
  <path d="M64 88 C74 75 92 68 106 52 C108 66 100 80 84 86 C96 82 103 76 108 68 C110 78 100 90 80 94 C90 92 96 88 100 82 C94 94 80 102 64 106 Z" 
        fill="url(#flameRight)" filter="url(#dropShadow)" />

  <!-- Dynamic Primary Flames Outer -->
  <path d="M64 16 C68 28 78 40 86 48 C82 46 76 44 72 44 C80 54 84 66 78 78 C74 68 70 62 66 60 C66 70 60 84 48 92 C56 82 58 72 56 64 C52 70 46 74 40 76 C46 64 54 52 52 38 C56 46 60 50 62 50 C62 38 63 26 64 16 Z" 
        fill="url(#flameLeft)" filter="url(#ffGlow)" />

  <!-- Inner Hot White-Yellow Core Flame -->
  <path d="M64 26 C66 36 72 46 76 52 C73 50 69 49 67 49 C72 57 74 65 70 73 C67 66 64 62 62 60 C62 66 58 76 50 82 C55 75 56 68 55 62 C53 66 49 69 45 70 C49 61 55 52 54 41 C57 47 60 50 61 50 C61 41 62 33 64 26 Z" 
        fill="#fffae6" opacity="0.9" />

  <!-- Iconic FF Angular Esports Monogram in Center -->
  <!-- First 'F' -->
  <path d="M42 36 L62 36 L59 44 L49 44 L47 50 L56 50 L53 57 L44 57 L36 82 L27 82 L38 46 L38 36 Z" 
        fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" filter="url(#dropShadow)" />
  <!-- Second 'F' interlaced & offset -->
  <path d="M58 36 L78 36 L75 44 L65 44 L63 50 L72 50 L69 57 L60 57 L52 82 L43 82 L54 46 L54 36 Z" 
        fill="#f8fafc" stroke="#b91c1c" stroke-width="1.5" stroke-linejoin="round" filter="url(#dropShadow)" />

  <!-- Inner Gold Accents on FF -->
  <polygon points="44,38 60,38 58,42 47,42" fill="#ffd700" />
  <polygon points="60,38 76,38 74,42 63,42" fill="#ffd700" />

  <!-- MAX 3D Plaque at the Bottom -->
  <g transform="translate(0, 4)">
    <!-- Badge Background -->
    <path d="M34 94 L94 94 L88 114 L28 114 Z" fill="#000000" />
    <path d="M35 95 L93 95 L88 112 L30 112 Z" fill="url(#ffGoldRim)" />
    <path d="M37 97 L91 97 L86 110 L32 110 Z" fill="url(#maxBadgeGrad)" />
    
    <!-- MAX Text Highlight -->
    <text x="61" y="107" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="12" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="2.5" 
          text-anchor="middle" 
          fill="#ffffff" 
          stroke="#000000" 
          stroke-width="0.8">
      MAX
    </text>
    <text x="61" y="106.5" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="12" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="2.5" 
          text-anchor="middle" 
          fill="#fff5cc">
      MAX
    </text>
  </g>

  <!-- Corner Tech Accents -->
  <polygon points="12,24 24,18 20,28" fill="#ffd24d" />
  <polygon points="116,24 104,18 108,28" fill="#ffd24d" />
</svg>
